<text x="20" y="930" font-size="12" fill="#333">Knobs are wired active-high: KY-040 + to GND and KY-040 GND to 3.3V. The module's resistors act as pull-downs; no external parts, no diodes.</text>
<text x="20" y="948" font-size="12" fill="#333">Wake: all 12 knob lines (CLK, DT and SW of every knob) are RTC pins in the EXT1 ANY_HIGH wake set, so turning or pressing any knob wakes the board.</text>
<text x="20" y="966" font-size="12" fill="#333">Free for later: GPIO18, GPIO19 (outputs ok) and GPIO2 (strapping, RTC). Flash pins (GPIO6-11), GPIO0/12 and UART0 must not be used.</text>
</svg>