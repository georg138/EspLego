# Reusable per-remote package for a LEGO Powered Up Remote (Handset 88010).
# Instantiated once per registered remote from the top-level config via
# `packages:` + `vars:`. Vars: remote_id (remote1, remote2), remote_index
# (1..2, matching the id), remote_mac, remote_name. Needs remote-slots.yaml
# included once, and a `remote_activity` script in the top-level config.
#
# Only the first two remotes that connect are used: they claim a control slot
# (see remote-slots.yaml), slot 1 drives hub1 + hub2 and slot 2 drives hub3 +
# hub4, left button group -> first hub, right group -> second. `+`/`-` step
# speed by 10, red stops. A third/fourth remote that connects while both
# slots are taken is disconnected and ignored until a slot frees up.
#
# Every button press runs `remote_activity` (the dev config uses it to restart
# its inactivity timer so deep sleep doesn't trigger while someone is playing).
#
# The remote powers itself off when idle - wake it with its green button and
# it reconnects automatically. When an active remote disconnects, its two hubs
# are stopped (an unattended train shouldn't keep running with nobody holding
# the controller) and its slot is freed.

globals:
  - id: ${remote_id}_slot  # 0 = not active, 1/2 = the control slot it owns
    type: int
    initial_value: "0"
  - id: ${remote_id}_rejected  # true while turned away because both slots are taken
    type: bool
    initial_value: "false"

script:
  # Called by remotes_rearm when a slot frees up: retry if this remote was turned away.
  - id: ${remote_id}_rearm
    then:
      - if:
          condition:
            lambda: return id(${remote_id}_rejected);
          then:
            - lambda: id(${remote_id}_rejected) = false;
            - ble_client.connect: ${remote_id}_ble

ble_client:
  - mac_address: ${remote_mac}
    id: ${remote_id}_ble
    on_connect:
      - lambda: |-
          if (id(slot1_owner) == 0) {
            id(slot1_owner) = ${remote_index};
            id(${remote_id}_slot) = 1;
          } else if (id(slot2_owner) == 0) {
            id(slot2_owner) = ${remote_index};
            id(${remote_id}_slot) = 2;
          } else {
            id(${remote_id}_rejected) = true;
          }
      - if:
          condition:
            lambda: return id(${remote_id}_rejected);
          then:
            - logger.log: "${remote_name}: both remote slots are taken, ignoring this remote"
            - ble_client.disconnect: ${remote_id}_ble
    on_disconnect:
      - if:
          condition:
            lambda: return id(${remote_id}_slot) != 0;
          then:
            - script.execute:
                id: remote_drive
                slot: !lambda return id(${remote_id}_slot);
                side: 2
                delta: 0
                stop: true
            - lambda: |-
                if (id(slot1_owner) == ${remote_index}) id(slot1_owner) = 0;
                if (id(slot2_owner) == ${remote_index}) id(slot2_owner) = 0;
                id(${remote_id}_slot) = 0;
            - script.execute: remotes_rearm

switch:
  - platform: ble_client
    ble_client_id: ${remote_id}_ble
    name: "${remote_name} BLE Enabled"
    id: ${remote_id}_ble_enabled

lwp3_hub:
  - id: ${remote_id}
    name: ${remote_name}
    ble_client_id: ${remote_id}_ble

sensor:
  - platform: lwp3_hub
    lwp3_hub_id: ${remote_id}
    name: "${remote_name} Battery"

light:
  - platform: lwp3_hub
    lwp3_hub_id: ${remote_id}
    name: "${remote_name} LED"

binary_sensor:
  - platform: lwp3_hub
    lwp3_hub_id: ${remote_id}
    group: left
    button: plus
    name: "${remote_name} Left Plus"
    on_press:
      - script.execute: remote_activity
      - script.execute:
          id: remote_drive
          slot: !lambda return id(${remote_id}_slot);
          side: 0
          delta: 10
          stop: false
  - platform: lwp3_hub
    lwp3_hub_id: ${remote_id}
    group: left
    button: minus
    name: "${remote_name} Left Minus"
    on_press:
      - script.execute: remote_activity
      - script.execute:
          id: remote_drive
          slot: !lambda return id(${remote_id}_slot);
          side: 0
          delta: -10
          stop: false
  - platform: lwp3_hub
    lwp3_hub_id: ${remote_id}
    group: left
    button: red
    name: "${remote_name} Left Red"
    on_press:
      - script.execute: remote_activity
      - script.execute:
          id: remote_drive
          slot: !lambda return id(${remote_id}_slot);
          side: 0
          delta: 0
          stop: true
  - platform: lwp3_hub
    lwp3_hub_id: ${remote_id}
    group: right
    button: plus
    name: "${remote_name} Right Plus"
    on_press:
      - script.execute: remote_activity
      - script.execute:
          id: remote_drive
          slot: !lambda return id(${remote_id}_slot);
          side: 1
          delta: 10
          stop: false
  - platform: lwp3_hub
    lwp3_hub_id: ${remote_id}
    group: right
    button: minus
    name: "${remote_name} Right Minus"
    on_press:
      - script.execute: remote_activity
      - script.execute:
          id: remote_drive
          slot: !lambda return id(${remote_id}_slot);
          side: 1
          delta: -10
          stop: false
  - platform: lwp3_hub
    lwp3_hub_id: ${remote_id}
    group: right
    button: red
    name: "${remote_name} Right Red"
    on_press:
      - script.execute: remote_activity
      - script.execute:
          id: remote_drive
          slot: !lambda return id(${remote_id}_slot);
          side: 1
          delta: 0
          stop: true
