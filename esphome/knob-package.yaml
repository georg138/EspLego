# Reusable per-knob package: one KY-040 rotary encoder + push button that
# drives ONE hub (both its ports A/B). Instantiated once per physical knob from
# train-controller-dev.yaml via `packages:` + `vars:`. Vars: knob_id, knob_name,
# hub_id (hub1..hub4), alt_hub_id, clk_pin, dt_pin, sw_pin. Needs an `inactivity_timer`
# script in the top-level config.
#
# Wiring is ACTIVE-HIGH: module `+` to GND and module GND to 3.3V (the two
# power pins swapped), CLK/DT/SW to the pins. The module's own resistors then act
# as pull-downs and keep its onboard debounce, so no internal or external
# resistors are needed (input-only pins 34-39 are fine). Bench-tested clean with
# esphome/knob-test.yaml. All three lines (CLK/DT/SW) are RTC pins and are in the
# EXT1 deep-sleep wake set, so both turning and pressing wake the board.
#
# `alt_hub_id` is an alternative hub that shares this knob (hub1/hub5: only one
# of the two is normally powered on). Set it equal to `hub_id` for a knob with
# no alternative. The knob drives `alt_hub_id` only while it is connected and
# `hub_id` is not; otherwise it drives `hub_id`.
#
# The knob is ABSOLUTE: speed 0 is always the same physical knob position. Turning
# `${knob_id}_pos` (detent count) away from `${knob_id}_zero` sets the speed
# directly: a +-2 detent dead zone around the zero position is speed 0, beyond it
# ${knob_step} % per detent (a 20-detent KY-040: one full turn = 0..100), clamped at
# +-100 so winding further does not move the zero. The zero position is only
# re-set (`${knob_id}_sync`) when a hub of this knob connects (and at boot), when
# the knob button stops the hub, on Stop All, and when coupling is toggled; each
# re-sets it so the knob's CURRENT position maps to the hub's current speed. A
# hub moved from a remote or Home Assistant is therefore not followed: the next
# turn jumps to the knob's own position. Pressing the button stops the hub (and
# puts a port-B headlight back to automatic); turning while pushed dims that
# light. Every action restarts the inactivity timer. Waking from deep sleep is NOT
# done here: the SW pins are the EXT1 wake set (see deep_sleep in controls.yaml
# and docs/gpio_pinout.md).

globals:
  - id: ${knob_id}_pos  # detent counter (turns since boot, clamped around zero)
    type: int
    initial_value: "0"
  - id: ${knob_id}_zero  # detent counter value that means speed 0
    type: int
    initial_value: "0"
  - id: ${knob_id}_last  # last speed this knob applied (skip duplicate writes)
    type: int
    initial_value: "0"
  - id: ${knob_id}_rotated_held  # knob was turned while pushed -> that press is not a click
    type: bool
    initial_value: "false"

script:
  # Re-sets the zero position so the knob's current position means `speed`
  # (0 after a connect/stop). See header.
  - id: ${knob_id}_sync
    parameters:
      speed: int
    then:
      - lambda: |-
          const int zero_band = 2;
          const int off = speed == 0 ? 0 : (speed > 0 ? 1 : -1) * (zero_band + (std::abs(speed) + ${knob_step} / 2) / ${knob_step});
          id(${knob_id}_zero) = id(${knob_id}_pos) - off;
          id(${knob_id}_last) = speed;
  # dir: +1 clockwise, -1 anticlockwise. Drives whichever of hub_id/alt_hub_id
  # is currently active (see header).
  - id: ${knob_id}_step
    mode: queued
    parameters:
      dir: int
    then:
      - lambda: |-
          const int zero_band = 2;
          const bool use_alt = id(${alt_hub_id}_ble).connected() && !id(${hub_id}_ble).connected();
          auto *pa = use_alt ? id(${alt_hub_id}_port_a) : id(${hub_id}_port_a);
          auto *pb = use_alt ? id(${alt_hub_id}_port_b) : id(${hub_id}_port_b);
          // Rotate while pushed: dim the active hub's light by hand instead of
          // changing speed (only hubs whose port B is `light: true`).
          if (id(${knob_id}_button).state) {
            if (pb->is_light()) {
              pb->set_light_override(std::max(0, std::min(100, (int) pb->state + dir * 10)));
              id(${knob_id}_rotated_held) = true;
            }
            return;
          }
          // Position relative to the zero position, clamped so winding past
          // +-100 % does not move the zero.
          const int max_off = zero_band + (100 + ${knob_step} - 1) / ${knob_step};
          int &pos = id(${knob_id}_pos);
          const int zero = id(${knob_id}_zero);
          pos = std::max(zero - max_off, std::min(zero + max_off, pos + dir));
          const int off = pos - zero;
          const int mag = std::abs(off) <= zero_band ? 0 : std::min(100, (std::abs(off) - zero_band) * ${knob_step});
          const int v = off < 0 ? -mag : mag;
          if (v == id(${knob_id}_last))
            return;
          id(${knob_id}_last) = v;
          id(ref_speed) = v;
          if (id(coupled)) {
            id(apply_all)->execute(v);
          } else {
            pa->make_call().set_value(v).perform();
            pb->make_call().set_value(v).perform();
          }

sensor:
  - platform: rotary_encoder
    id: ${knob_id}
    name: "${knob_name} Position"
    internal: true  # raw counter, not meaningful - the hub's own number entities carry the speed
    pin_a:
      number: ${clk_pin}
      allow_other_uses: true  # also in deep_sleep esp32_ext1_wakeup
    pin_b:
      number: ${dt_pin}
      allow_other_uses: true
    resolution: 2  # pulses per detent - tune to taste once you feel the turn rate
    on_clockwise:
      - script.execute:
          id: ${knob_id}_step
          dir: 1
      - script.execute: inactivity_timer
    on_anticlockwise:
      - script.execute:
          id: ${knob_id}_step
          dir: -1
      - script.execute: inactivity_timer

binary_sensor:
  - platform: gpio
    id: ${knob_id}_button
    name: "${knob_name} Button"
    pin:
      number: ${sw_pin}
      mode:
        input: true
      allow_other_uses: true  # also listed in deep_sleep esp32_ext1_wakeup
    on_press:
      - lambda: id(${knob_id}_rotated_held) = false;
    on_click:
      # A press that was used to dim the light (rotate while pushed) must not
      # also stop the train.
      - if:
          condition:
            lambda: 'return !id(${knob_id}_rotated_held);'
          then:
            - if:
                condition:
                  lambda: 'return id(coupled);'
                then:
                  - script.execute: stop_all  # coupled: a click stops every hub
                else:
                  - number.set: { id: "${hub_id}_port_a", value: 0 }
                  - number.set: { id: "${hub_id}_port_b", value: 0 }
                  - number.set: { id: "${alt_hub_id}_port_a", value: 0 }
                  - number.set: { id: "${alt_hub_id}_port_b", value: 0 }
                  # Back to automatic headlight (after the 0 above, so it ends up off).
                  - lambda: |-
                      id(${hub_id}_port_b)->set_light_override(-1);
                      id(${alt_hub_id}_port_b)->set_light_override(-1);
                      id(ref_speed) = 0;
                  # The knob's current position becomes the new zero.
                  - script.execute:
                      id: ${knob_id}_sync
                      speed: 0
      - script.execute: inactivity_timer
