# Physical controls shared by train-controller.yaml and train-controller-dev.yaml:
# four KY-040 knobs (one per hub, see knob-package.yaml), the Couple / Stop All
# buttons, status LEDs, battery sensor and the inactivity timer + deep sleep.
# Needs the hubs defined by the top-level config with the ids hub1..hub5
# (`hubN_ble`, `hubN_port_a`, `hubN_port_b`) and the `battery_low_v`
# substitution. Pin map: docs/gpio_pinout.md.

packages:
  knob1: !include
    file: knob-package.yaml
    vars:
      knob_id: knob1
      knob_name: "Knob 1"
      hub_id: hub1
      alt_hub_id: hub5
      clk_pin: GPIO32
      dt_pin: GPIO25
      sw_pin: GPIO39
  knob2: !include
    file: knob-package.yaml
    vars:
      knob_id: knob2
      knob_name: "Knob 2"
      hub_id: hub2
      alt_hub_id: hub2
      clk_pin: GPIO35
      dt_pin: GPIO33
      sw_pin: GPIO34
  knob3: !include
    file: knob-package.yaml
    vars:
      knob_id: knob3
      knob_name: "Knob 3"
      hub_id: hub3
      alt_hub_id: hub3
      clk_pin: GPIO27
      dt_pin: GPIO26
      sw_pin: GPIO14
  knob4: !include
    file: knob-package.yaml
    vars:
      knob_id: knob4
      knob_name: "Knob 4"
      hub_id: hub4
      alt_hub_id: hub4
      clk_pin: GPIO13
      dt_pin: GPIO4
      sw_pin: GPIO15

# Merges with the `esphome:` block in common/base.yaml. Arms the inactivity
# timer on every boot - both the first boot and every wake-from-sleep reboot
# (deep sleep wake on ESP32 is a full reboot, not an in-place resume) - so the
# device doesn't stay awake forever if the knob/button are never touched again
# after waking. The status LED is driven by the `interval:` below.
esphome:
  on_boot:
    then:
      - script.execute: inactivity_timer

globals:
  - id: coupled  # true = any knob drives every connected hub together (Couple button)
    type: bool
    initial_value: "false"
  - id: ref_speed  # speed the user last set with a knob; master value while coupled
    type: int
    initial_value: "0"
  - id: sleep_warning  # true during the last 30 s before deep sleep -> LED blinks
    type: bool
    initial_value: "false"
  - id: idle_s  # seconds idle so far (inactivity_timer)
    type: int
    initial_value: "0"
  - id: idle_limit_s  # idle seconds before sleep: 120 if all motors stopped, else 600
    type: int
    initial_value: "600"
  - id: was_running  # any motor nonzero at the last tick
    type: bool
    initial_value: "true"
  - id: going_to_sleep  # true once the final sleep sequence starts -> LED stays off
    type: bool
    initial_value: "false"

# Dual-color (red/blue, common anode) status LED, ticking every 500 ms. The
# output ids still say "green" (GPIO23) but that channel is the blue LED:
#   blue = at least one hub connected, magenta (red+blue) = no hub connected,
#   alternating with red every tick = battery low (hub state stays readable),
#   on/off blink (2 ticks on, 2 off) = sleep warning, off = asleep.
interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (id(going_to_sleep)) {
            id(status_green).set_state(false);
            id(status_red).set_state(false);
            return;
          }
          static uint32_t tick = 0;
          tick++;
          // A hub (re)connecting re-zeroes its knob at the knob's current position.
          static bool c1 = false, c2 = false, c3 = false, c4 = false, c5 = false;
          const bool n1 = id(hub1_ble)->connected(), n2 = id(hub2_ble)->connected(),
                     n3 = id(hub3_ble)->connected(), n4 = id(hub4_ble)->connected(),
                     n5 = id(hub5_ble)->connected();
          if ((n1 && !c1) || (n5 && !c5)) id(knob1_sync)->execute(0);
          if (n2 && !c2) id(knob2_sync)->execute(0);
          if (n3 && !c3) id(knob3_sync)->execute(0);
          if (n4 && !c4) id(knob4_sync)->execute(0);
          c1 = n1; c2 = n2; c3 = n3; c4 = n4; c5 = n5;
          bool hub = id(hub1_ble)->connected() || id(hub2_ble)->connected() ||
                     id(hub3_ble)->connected() || id(hub4_ble)->connected() ||
                     id(hub5_ble)->connected();
          float volts = id(battery_v).state;  // NaN until the first reading
          bool low = !std::isnan(volts) && volts < ${battery_low_v};
          // Hub LEDs: solid while connected, blinking in unison (1 Hz) while coupled.
          // Hub 5 shares Hub 1's LED (they are mutually exclusive alternatives).
          const bool lit = !id(coupled) || (tick % 2) == 0;
          id(hub1_status_led).set_state((id(hub1_ble)->connected() || id(hub5_ble)->connected()) && lit);
          id(hub2_status_led).set_state(id(hub2_ble)->connected() && lit);
          id(hub3_status_led).set_state(id(hub3_ble)->connected() && lit);
          id(hub4_status_led).set_state(id(hub4_ble)->connected() && lit);
          bool green = true;
          bool red = !hub;  // amber when no hub
          if (low && (tick % 2) == 1) {  // alternate with red
            green = false;
            red = true;
          }
          if (id(sleep_warning) && ((tick / 2) % 2) == 1) {  // blink off phase
            green = false;
            red = false;
          }
          id(status_green).set_state(green);
          id(status_red).set_state(red);

# Physical controls: four KY-040 knobs, one per hub (see knob-package.yaml), added
# via the knob1..knob4 packages above. Each knob's CLK/DT/SW pins are listed there
# and in docs/gpio_pinout.md.

sensor:
  # Battery pack voltage through a 100k/100k divider from VIN (halves ~6 V to
  # ~3 V, inside the 12 dB range) to GPIO36 (ADC1, input-only), hence the x2.
  # Calibrate `multiply` against a multimeter.
  - platform: adc
    id: battery_v
    pin: GPIO36
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 10s
    filters:
      - median:
          window_size: 5
          send_every: 1
      - multiply: 2.0
# Battery power (4xAA -> board VIN, no physical switch) + deep sleep: any knob's
# button press or rotation wakes the board (EXT1 ANY_HIGH, see deep_sleep below). Status
# LEDs: GPIO22 (Hub 1 connected), GPIO21 (Hub 2 connected), GPIO17 (Hub 3
# connected), GPIO16 (Hub 4 connected), GPIO23 + GPIO5 (green/red dual-color
# status LED) - see docs/gpio_pinout.md for the full pin map.
output:
  - platform: gpio
    id: hub1_status_led
    pin: GPIO22
  - platform: gpio
    id: hub2_status_led
    pin: GPIO21
  - platform: gpio
    id: hub3_status_led
    pin: GPIO17
  - platform: gpio
    id: hub4_status_led
    pin: GPIO16
  # Dual-color status LED (common anode to 3.3V, wired active-LOW so the outputs
  # are inverted; each color through its own ~330 ohm
  # resistor): green on GPIO23, red on GPIO5.
  - platform: gpio
    id: status_green
    pin:
      number: GPIO23
      inverted: true
  - platform: gpio
    id: status_red
    pin:
      number: GPIO5
      inverted: true

# Extra buttons on non-RTC pins (button to GND, internal pull-up, active-low):
# they work while the board is awake; only the knobs wake it from deep sleep.
binary_sensor:
  - platform: gpio
    id: couple_button
    name: "Couple Hubs Button"
    pin:
      number: GPIO18
      mode: { input: true, pullup: true }
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_click:
      - lambda: |-
          id(coupled) = !id(coupled);
          // Each knob's current position now means the shared speed, so every
          // knob continues from where the hubs actually are.
          id(knob1_sync)->execute(id(ref_speed));
          id(knob2_sync)->execute(id(ref_speed));
          id(knob3_sync)->execute(id(ref_speed));
          id(knob4_sync)->execute(id(ref_speed));
      # Sync: coupling sets every connected hub to the last knob speed.
      - if:
          condition:
            lambda: 'return id(coupled);'
          then:
            - script.execute:
                id: apply_all
                speed: !lambda 'return id(ref_speed);'
      - script.execute: inactivity_timer
  - platform: gpio
    id: stop_all_button
    name: "Stop All Button"
    pin:
      number: GPIO19
      mode: { input: true, pullup: true }
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_click:
      - script.execute: stop_all
      - script.execute: inactivity_timer
  - platform: template
    name: "Hubs Coupled"
    lambda: 'return id(coupled);'

deep_sleep:
  id: deep_sleep_1
  # Any knob wakes the board, by button press or by rotation: all 12 knob lines
  # (CLK, DT and SW of every knob) are RTC pins and form the EXT1 wake set.
  # Knobs are wired ACTIVE-HIGH (module + to GND, module GND to 3.3V, so the
  # module's own resistors act as pull-downs and every line idles low), hence
  # ANY_HIGH, the only polarity the classic ESP32 offers for several pins. No
  # diodes, no internal or external pulls. The turn that wakes the board is lost
  # (it reboots), so the first click only wakes, it doesn't change speed.
  esp32_ext1_wakeup:
    pins:
      - number: GPIO32
        allow_other_uses: true
      - number: GPIO25
        allow_other_uses: true
      - number: GPIO39
        allow_other_uses: true
      - number: GPIO35
        allow_other_uses: true
      - number: GPIO33
        allow_other_uses: true
      - number: GPIO34
        allow_other_uses: true
      - number: GPIO27
        allow_other_uses: true
      - number: GPIO26
        allow_other_uses: true
      - number: GPIO14
        allow_other_uses: true
      - number: GPIO13
        allow_other_uses: true
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO15
        allow_other_uses: true
    mode: ANY_HIGH

script:
  # Sets every CONNECTED hub's ports A and B to `speed` (each number still applies
  # its own min_power / headlight handling). Disconnected hubs are skipped so
  # they don't publish a stale speed.
  - id: apply_all
    mode: queued
    parameters:
      speed: int
    then:
      - lambda: |-
          auto apply = [&](bool connected, auto *a, auto *b) {
            if (!connected) return;
            a->make_call().set_value(speed).perform();
            b->make_call().set_value(speed).perform();
          };
          apply(id(hub1_ble)->connected(), id(hub1_port_a), id(hub1_port_b));
          apply(id(hub2_ble)->connected(), id(hub2_port_a), id(hub2_port_b));
          apply(id(hub3_ble)->connected(), id(hub3_port_a), id(hub3_port_b));
          apply(id(hub4_ble)->connected(), id(hub4_port_a), id(hub4_port_b));
          apply(id(hub5_ble)->connected(), id(hub5_port_a), id(hub5_port_b));
  # Zero every hub's motors unconditionally and drop manual headlight overrides.
  # Does NOT touch inactivity_timer: the sleep sequence calls this from inside it.
  - id: stop_all
    then:
      - lambda: |-
          id(hub1_port_a)->make_call().set_value(0).perform();
          id(hub1_port_b)->make_call().set_value(0).perform();
          id(hub2_port_a)->make_call().set_value(0).perform();
          id(hub2_port_b)->make_call().set_value(0).perform();
          id(hub3_port_a)->make_call().set_value(0).perform();
          id(hub3_port_b)->make_call().set_value(0).perform();
          id(hub4_port_a)->make_call().set_value(0).perform();
          id(hub4_port_b)->make_call().set_value(0).perform();
          id(hub5_port_a)->make_call().set_value(0).perform();
          id(hub5_port_b)->make_call().set_value(0).perform();
          id(hub1_port_b)->set_light_override(-1);
          id(hub2_port_b)->set_light_override(-1);
          id(hub3_port_b)->set_light_override(-1);
          id(hub4_port_b)->set_light_override(-1);
          id(hub5_port_b)->set_light_override(-1);
          id(ref_speed) = 0;
          // Every knob's current position now means speed 0.
          id(knob1_sync)->execute(0);
          id(knob2_sync)->execute(0);
          id(knob3_sync)->execute(0);
          id(knob4_sync)->execute(0);
  # Called by remote-package.yaml on every remote button press - keeps the
  # board awake while someone is using a remote.
  - id: remote_activity
    then:
      - script.execute: inactivity_timer
  - id: inactivity_timer
    # restart: each call (boot, knob turn, button press) cancels and restarts
    # the delay below, so sleep only actually happens after a real idle period.
    mode: restart
    then:
      - lambda: |-
          id(sleep_warning) = false;
          id(idle_s) = 0;
          id(idle_limit_s) = 600;
          id(was_running) = true;
      # Tick once a second. Idle limit is 2 min while every motor is at 0 and
      # 10 min while any is running; the last 30 s of it is the sleep warning.
      # Any change between "running" and "all stopped" restarts the count, so
      # stopping the last train always gives a full 2 min (not an instant sleep).
      - while:
          condition:
            lambda: 'return id(idle_s) < id(idle_limit_s);'
          then:
            - delay: 1s
            - lambda: |-
                bool running =
                    (int) id(hub1_port_a).state != 0 || (int) id(hub1_port_b).state != 0 ||
                    (int) id(hub2_port_a).state != 0 || (int) id(hub2_port_b).state != 0 ||
                    (int) id(hub3_port_a).state != 0 || (int) id(hub3_port_b).state != 0 ||
                    (int) id(hub4_port_a).state != 0 || (int) id(hub4_port_b).state != 0 ||
                    (int) id(hub5_port_a).state != 0 || (int) id(hub5_port_b).state != 0;
                if (running != id(was_running)) {
                  id(was_running) = running;
                  id(idle_s) = 0;
                } else {
                  id(idle_s)++;
                }
                id(idle_limit_s) = running ? 600 : 120;
                id(sleep_warning) = id(idle_s) >= id(idle_limit_s) - 30;
      - lambda: id(sleep_warning) = true;
      # Safety: zero every motor before sleeping regardless of whether a train
      # was left running - LEGO hubs don't auto-stop just because the BLE
      # link drops, so skipping this could leave a train running unattended
      # until the hub's own battery dies.
      - script.execute: stop_all
      - delay: 500ms  # let the write-without-response commands actually reach the hubs before the radio powers down
      - lambda: id(going_to_sleep) = true;
      - output.turn_off: status_green
      - output.turn_off: status_red
      - output.turn_off: hub1_status_led
      - output.turn_off: hub2_status_led
      - output.turn_off: hub3_status_led
      - output.turn_off: hub4_status_led
      - deep_sleep.enter: deep_sleep_1
