# Global on-device safety switch: zeroes every hub's motor ports. Works even if
# Home Assistant/Wi-Fi is down, since it only depends on entities already local
# to this device. Specific to the 4-hub train-controller.yaml (hub1..hub4).
switch:
  - platform: template
    name: "Stop All Trains"
    id: stop_all_trains
    icon: "mdi:stop-circle"
    optimistic: true
    turn_on_action:
      - number.set: { id: hub1_port_a, value: 0 }
      - number.set: { id: hub1_port_b, value: 0 }
      - number.set: { id: hub2_port_a, value: 0 }
      - number.set: { id: hub2_port_b, value: 0 }
      - number.set: { id: hub3_port_a, value: 0 }
      - number.set: { id: hub3_port_b, value: 0 }
      - number.set: { id: hub4_port_a, value: 0 }
      - number.set: { id: hub4_port_b, value: 0 }
      - switch.turn_off: stop_all_trains
