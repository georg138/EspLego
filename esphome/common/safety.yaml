# Global on-device safety switch: zeroes every hub's motors via the `stop_all`
# script from controls.yaml (hubs 1-5, also drops manual headlight overrides).
# Works even if Home Assistant/Wi-Fi is down, since it only depends on entities
# already local to this device.
switch:
  - platform: template
    name: "Stop All Trains"
    id: stop_all_trains
    icon: "mdi:stop-circle"
    optimistic: true
    turn_on_action:
      - script.execute: stop_all
      - switch.turn_off: stop_all_trains
